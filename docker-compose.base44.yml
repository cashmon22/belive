services:
  app:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:8080"
    env_file:
      - /run/base44/app.env
    environment:
      # Platform sets this; Vite >= 6.1 appends it to allowedHosts so the preview origin is accepted.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: sh -c "corepack enable pnpm && pnpm install && pnpm dev"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

volumes:
  node_modules:
